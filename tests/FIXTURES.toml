# The fixtures licence manifest (ADR-010).
#
# Every file under tests/ or evals/ that is not Python source is listed here, with where
# it came from and the licence it is under. scripts/check_fixtures.py fails, and so does
# CI, when a file is present and not listed, or listed and not present.
#
# origin is one of:
#   synthetic   invented for the tests; quotes no real source
#   owner       written by the repository owner
#   licensed    third-party content whose licence permits redistribution; give `source`
#
# No third-party article text belongs in this repository. If a file cannot honestly be
# given one of these origins, it must not be committed.

schema = "fixtures.v1"

