# The application package is src/ai_briefing (M1 issue 1.1). Each issue adds the runtime
# dependencies it needs. Linting, type checking and tests cover the
# package and the repository's own tooling (scripts/ and tests/).

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[project]
name = "ai-briefing"
version = "0.0.0"
description = "Evidence-first AI intelligence and learning briefings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",   # domain records (M1 issue 1.2)
  "jsonschema>=4.23", # validates the briefing against schemas/ before it is exported
  "sqlalchemy>=2.0",  # the SQLite system of record (ADR-002, M1 issue 1.3)
  "alembic>=1.13",    # migrations, in batch mode for SQLite
  "pyyaml>=6.0",      # reads config/*.yaml
  "anthropic>=1.0",   # the one model provider (ADR-009, M1 issue 1.5)
  "feedparser>=6.0",  # RSS and Atom (M1 issue 1.4)
  "tzdata>=2025.1",   # time zones for a briefing's local date, where the system has none
]

[project.scripts]
ai-briefing = "ai_briefing.runtime.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.23",
]

[tool.uv]
# Do not resolve to releases newer than this date. Raising it is a dependency change
# and needs owner review (ADR-011).
exclude-newer = "2026-11-07T00:00:00Z"

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
  "PT",  # pytest style
  "RUF", # ruff-specific
  "N",   # naming
  "S",   # bandit-style security checks
  "T20", # no stray print()
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert is the point of a test
]
"scripts/**" = [
  "S603", # round_lib runs `gh` with a checked argument list; no shell, no untrusted command
  "S607",
]

[tool.ruff.lint.isort]
known-first-party = [
  "ai_briefing",
  "merge_eligibility",
  "offline_guard",
  "pr_wait",
  "review_threads",
  "round_lib",
  "round_outcome",
  "round_plan",
]

# ---------------------------------------------------------------------------
# Types: strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests", "migrations"]
mypy_path = ["scripts"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# feedparser ships no type information.
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
