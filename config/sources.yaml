    model_submission: full_text
    retention_days:
      metadata: null
      feed_summary: 0
      body: 90
    excerpts_allowed: true
    excerpt_limit_chars: 300
    attribution: Link to the original post.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-23
      urls:
        - https://policies.google.com/terms
        - https://research.google/robots.txt
      automated_access: explicit
      restrictions:
        - Automated access is prohibited where machine-readable instructions such as robots.txt disallow it. robots.txt currently allows everything; re-check it when re-reviewing.
        - Do not remove or alter Google branding or legal notices.
      uncertainties:
        - No licence for blog content is stated.
        - "The terms do not expressly grant the right to keep article text or send it to a model. The owner approved private full-text reading on 2026-11-23 on this basis: the terms do not prohibit it, robots.txt allows it, the text is kept privately for 90 days and is never republished."
        - Google's service-specific terms and generative AI policy were not read.

  - id: hugging-face-blog
    name: Hugging Face blog
    kind: rss
    url: https://huggingface.co/blog/feed.xml
    role: vendor
    enabled: true
    mode: metadata_only
    polling_interval_minutes: 360
    rate_limit:
      min_seconds_between_requests: 10
      max_connections: 1
    store:
      metadata: true
      feed_summary: false
      body: false
    model_submission: metadata
    retention_days:
      metadata: null
      feed_summary: 0
    excerpts_allowed: false
    attribution: Link to the original post.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-23
      urls:
        - https://huggingface.co/terms-of-service
        - https://huggingface.co/content-policy
        - https://huggingface.co/robots.txt
      automated_access: interpretation
      restrictions:
        - The terms say proprietary materials may not be altered, reproduced or republished without written permission. Under ADR-012 that is an express refusal of copying, so article text is neither stored nor sent to the model.
        - The content policy prohibits excessive bulk activity.
      uncertainties:
        - The terms have no clause on automated reading. Access rests on the published feed and a robots.txt that allows everything.
        - The blog mixes official and community posts and states no licence for either. An individual post may carry its own licence; none was checked.
        - The owner approved sending the stored metadata (title, link, date) to the model on 2026-11-23.

  - id: simon-willison-entries
    name: Simon Willison's Weblog (long-form entries)
    kind: atom
    url: https://simonwillison.net/atom/entries/
    role: independent
    enabled: true
    mode: full_text
    polling_interval_minutes: 360
    rate_limit:
      min_seconds_between_requests: 10
      max_connections: 1
    store:
      metadata: true
      feed_summary: false
      body: true
    body:
      source: feed
      hosts: [simonwillison.net]
    model_submission: full_text
    retention_days:
      metadata: null
      feed_summary: 0
      body: 90
    excerpts_allowed: true
    excerpt_limit_chars: 300
    attribution: Link to the original post and name the author.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-23
      urls:
        - https://simonwillison.net/about/
        - https://simonwillison.net/robots.txt
      automated_access: interpretation
      restrictions:
        - robots.txt disallows /admin/ and /search/ only.
      uncertainties:
        - No licence or terms of use are stated, so default copyright applies. The feed carries the full post, so no page is fetched.
        - Access rests on the author offering Atom feeds for following the blog.
        - "The terms do not expressly grant the right to keep article text or send it to a model. The owner approved private full-text reading on 2026-11-23 on this basis: the terms do not prohibit it, robots.txt allows it, the text is kept privately for 90 days and is never republished."
        - The author has not been asked for permission. Asking would settle most of this.

  - id: hacker-news
    name: Hacker News
    kind: hn_api
    url: https://hacker-news.firebaseio.com/v0/
    role: community
    enabled: true
    mode: metadata_only
    polling_interval_minutes: 180
    rate_limit:
      min_seconds_between_requests: 1
      max_connections: 1
    store:
      metadata: true
      feed_summary: false
      body: false
    # Item id, title, link, score, comment count and time. Not the submitter's username
    # and not comment text.
    stored_fields: [id, title, url, score, descendants, time, type]
    model_submission: metadata
    retention_days:
      metadata: null
      feed_summary: 0
    excerpts_allowed: false
    attribution: Link to the Hacker News item and to the linked page.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-23
      urls:
        - https://github.com/HackerNews/API
        - https://www.ycombinator.com/legal
        - https://news.ycombinator.com/robots.txt
      automated_access: interpretation
      restrictions:
        - Use the official API only. Do not scrape news.ycombinator.com pages.
        - Pages linked from Hacker News on hosts outside this catalogue are not fetched.
      uncertainties:
        - The API README states no rate limit and no terms for the data. Its MIT licence covers the repository, not the data.
        - Y Combinator's terms cover all its subdomains and reportedly prohibit scraping and data mining. That clause was read from a summary of a truncated page and has not been verified verbatim.
        - Access rests on the API being Y Combinator's own published route.
        - Item titles are written by users and often copy a third-party headline. The owner approved sending the stored fields (title, link, score) to the model on 2026-11-23.

  - id: openai-news
    name: OpenAI News
    kind: rss
    url: https://openai.com/news/rss.xml
    role: vendor
    enabled: false
    mode: disabled
    polling_interval_minutes: 360
    rate_limit:
      min_seconds_between_requests: 10
      max_connections: 1
    store:
      metadata: false
      feed_summary: false
      body: false
    model_submission: none
    retention_days:
      metadata: 0
      feed_summary: 0
    excerpts_allowed: false
    attribution: Link to the original post.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-21
      urls:
        - https://openai.com/policies/terms-of-use/
        - https://openai.com/robots.txt
      automated_access: uncertain
      restrictions:
        - The terms define Services to include websites and prohibit automatically or programmatically extracting data.
      uncertainties:
        - The site publishes and links an RSS feed and its robots.txt allows everything, which conflicts with the wording of the terms. Disabled until the owner decides.
        - OpenAI's Service Terms and content-attribution page were not read.

