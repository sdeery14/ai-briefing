      body: false
    model_submission: none
    retention_days:
      metadata: 0
      feed_summary: 0
    excerpts_allowed: false
    attribution: Link to the release page.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-21
      urls:
        - https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
        - https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies
        - https://github.com/robots.txt
        - https://github.com/mlflow/mlflow/blob/master/LICENSE.txt
      automated_access: uncertain
      restrictions:
        - GitHub's robots.txt disallows Atom feed paths for generic agents.
        - GitHub's acceptable-use policy lists research and archival as the permitted purposes for scraping.
      uncertainties:
        - GitHub's REST API is the sanctioned route, but it needs an adapter that is not approved.
        - The repository is Apache-2.0; neither that licence nor GitHub's terms says release notes fall under it.

