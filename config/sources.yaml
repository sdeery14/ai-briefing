# Source catalogue and usage terms (ADR-003, ADR-010).
#
# Protected path: any change here needs the owner's review (ADR-011).
#
# Operating modes were approved by the owner on 2026-11-21 for personal, non-commercial use,
# and widened by the owner on 2026-11-23 to allow private full-text reading of three sources
# under ADR-012. Their terms are silent on that use; the records say so.
# The reasoning, quotations and links behind each record are in
# docs/operations/source-terms-records.md. This is an operating policy, not legal advice.
#
# Access, storage and submission to the model provider are three separate permissions:
#
#   terms.automated_access   whether reading the feed or API automatically is permitted
#                            explicit | interpretation | uncertain
#   store.*                  what may be kept in the database
#   model_submission         what may be sent to the model provider
#                            none | metadata | title_and_summary | full_text
#
# Modes:
#   full_text       metadata plus the article text, kept privately for body retention days
#   feed_summary    metadata plus the summary the source's own feed supplies
#   metadata_only   title, link, dates and identifiers only; feed summaries are discarded
#   disabled        nothing is fetched
#
# For a full_text source:
#   body.source     feed: the feed itself carries the article text; no page is fetched
#                   page: the article page is fetched, and only from a host in body.hosts
#   body.hosts      an item whose link is on any other host stays metadata-only
#   retention_days.body   the text is purged after this many days; its hash is kept
#   excerpt_limit_chars   the longest quotation a briefing may show from one article
#
# No source may be enabled, moved to a less restrictive mode, or have its model_submission
# widened without the owner's review. Article text never enters the repository.

schema: sources.v1

sources:
  - id: arxiv-cs-cl
    name: arXiv cs.CL
    kind: rss
    url: https://rss.arxiv.org/rss/cs.CL
    role: primary
    enabled: true
    mode: feed_summary
    polling_interval_minutes: 1440
    rate_limit:
      min_seconds_between_requests: 3
      max_connections: 1
    store:
      metadata: true
      feed_summary: true
      body: false
    model_submission: title_and_summary
    retention_days:
      metadata: null
      feed_summary: null
    excerpts_allowed: true
    attribution: Link to the arXiv abstract page. Do not imply endorsement by arXiv.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-21
      urls:
        - https://info.arxiv.org/help/api/tou.html
        - https://info.arxiv.org/help/license/index.html
        - https://info.arxiv.org/help/rss.html
        - https://info.arxiv.org/help/robots.html
      automated_access: explicit
      restrictions:
        - At most one request every three seconds, on a single connection.
        - Do not store and serve e-print content (PDFs, source files).
        - Do not represent the project as endorsed or supported by arXiv.
      uncertainties:
        - The terms do not mention AI tools. Sending abstracts to the model rests on the CC0 dedication of descriptive metadata, which the terms define as including abstracts.
        - The RSS page calls the feeds "intended primarily for human consumption"; one request a day is within the stated limits.

  - id: google-deepmind-blog
    name: Google DeepMind blog
    kind: rss
    url: https://deepmind.google/blog/rss.xml
    role: vendor
    enabled: true
    mode: full_text
    polling_interval_minutes: 360
    rate_limit:
      min_seconds_between_requests: 10
      max_connections: 1
    store:
      metadata: true
      feed_summary: false
      body: true
    body:
      source: page
      hosts: [deepmind.google]
    model_submission: full_text
    retention_days:
      metadata: null
      feed_summary: 0
      body: 90
    excerpts_allowed: true
    excerpt_limit_chars: 300
    attribution: Link to the original post.
    terms:
      reviewed_on: 2026-11-21
      approved_by_owner_on: 2026-11-23
      urls:
        - https://policies.google.com/terms
        - https://deepmind.google/robots.txt
      automated_access: explicit
      restrictions:
        - Automated access is prohibited where machine-readable instructions such as robots.txt disallow it. robots.txt currently allows everything; re-check it when re-reviewing.
        - Do not remove or alter Google branding or legal notices.
      uncertainties:
        - No licence for blog content is stated.
        - "The terms do not expressly grant the right to keep article text or send it to a model. The owner approved private full-text reading on 2026-11-23 on this basis: the terms do not prohibit it, robots.txt allows it, the text is kept privately for 90 days and is never republished."
        - Google's service-specific terms and generative AI policy were not read.

